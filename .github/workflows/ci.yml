name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-test-secret
      DATABASE_URL: sqlite:///instance/logivoice.db
      CORS_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: local
      STORAGE_ROOT: instance/storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests wsgi.py
      - name: Prepare local SQLite directory
        run: mkdir -p instance
      - name: Validate application import
        run: |
          python -c "
          import sys
          import traceback
          try:
              from wsgi import app
              print('Application imported successfully:', app.name)
          except BaseException:
              traceback.print_exc()
              sys.exit(1)
          "
      - name: Validate migrations
        run: |
          python - <<'PY'
          import traceback
          from flask.cli import cli

          try:
              cli.main(
                  args=['--app', 'wsgi:app', 'db', 'check'],
                  prog_name='flask',
                  standalone_mode=False,
              )
          except BaseException:
              traceback.print_exc()
              raise
          PY
      - name: Run tests
        run: pytest -q
