name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests wsgi.py
      - name: Validate application import and migrations
        run: |
          python -c "from wsgi import app; print(app.name)"
          flask --app wsgi:app db check
      - name: Run tests
        run: pytest -q
