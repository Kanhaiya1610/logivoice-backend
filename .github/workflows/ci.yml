name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-test-secret
      DATABASE_URL: sqlite:///instance/logivoice.db
      CORS_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: local
      STORAGE_ROOT: instance/storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests wsgi.py
      - name: Validate application import and migrations
        run: |
          python -c "from wsgi import app; print(app.name)"
          flask --app wsgi:app db check
      - name: Run tests
        run: pytest -q
